<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROGETTI & SAL 2026</title>
    
    <!-- COLLEGAMENTO PWA PER ANDROID -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b365d">

    <style>
        :root {
            --primary-color: #1b365d;
            --accent-color: #008080;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 20px;
            text-align: center;
            margin-top: 0;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .project-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .badge-team {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-right: 4px;
        }

        .progress-container {
            background-color: #e2e8f0;
            border-radius: 6px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            background-color: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .task-item {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
        }

        .timer-section {
            margin-top: 20px;
            border-top: 2px dashed #eef2f5;
            padding-top: 10px;
        }

        .timer-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            color: var(--primary-color);
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
        }

        button.stop { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>PROGETTI & SAL 2026</h1>
    
    <div class="form-group">
        <label for="projectSelect">Seleziona Progetto:</label>
        <select id="projectSelect" onchange="updateProjectDetails()"></select>
    </div>

    <div id="projectDetails" class="project-card"></div>

    <div class="timer-section">
        <h3 style="font-size:15px; margin-bottom:5px;">Traccia Tempo</h3>
        <div class="form-group">
            <input type="text" id="taskName" placeholder="Descrizione dell'attività...">
        </div>
        <div class="timer-display" id="display">00:00:00</div>
        <button id="actionBtn" onclick="toggleTimer()">Avvia Sessione di Lavoro</button>
    </div>
</div>

<script>
    // Data Base Progetti integrato
    const projectsData = {
        "FOOD": {
            objective: "Gestione fornitori Food e ottimizzazione listini 2026.",
            team: ["Buyer Food", "Qualifica Fornitori", "PDS"],
            tasks: [{ name: "Chiusura contratti prioritari", progress: 75 }]
        },
        "DashBoard FORNITORI": {
            objective: "Monitoraggio della spesa aziendale e fornitori attivi.",
            team: ["fzuppello@marr.it", "Controllo Gestione"],
            tasks: [{ name: "Aggiornamento dati spesa MARR SPA", progress: 90 }]
        },
        "CONTRATTI": {
            objective: "Rinnovo e monitoraggio dei contratti in scadenza 2026.",
            team: ["Ufficio Legale", "Buyer AS", "Buyer PDS"],
            tasks: [{ name: "Verifica contratti da chiudere", progress: 72 }]
        },
        "PIANO CANTIERI": {
            objective: "Pianificazione e stato avanzamento dei cantieri 2026.",
            team: ["Responsabile Cantieri", "Ufficio Tecnico"],
            tasks: [{ name: "Verifica tempistiche di consegna", progress: 30 }]
        }
    };

    const projectSelect = document.getElementById('projectSelect');
    const projectDetails = document.getElementById('projectDetails');

    document.addEventListener('DOMContentLoaded', () => {
        populateSelectOptions();
        updateProjectDetails();
    });

    function populateSelectOptions() {
        projectSelect.innerHTML = "";
        for (let key in projectsData) {
            let option = document.createElement('option');
            option.value = key;
            option.textContent = key;
            projectSelect.appendChild(option);
        }
    }

    function updateProjectDetails() {
        const selectedKey = projectSelect.value;
        const data = projectsData[selectedKey];
        if (!data) return;

        const teamHTML = data.team.map(m => `<span class="badge-team">${m}</span>`).join('');
        const tasksHTML = data.tasks.map(t => `
            <div class="task-item">
                <div style="display:flex; justify-content:space-between; font-weight:600;">
                    <span>${t.name}</span>
                    <span>${t.progress}%</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${t.progress}%;"></div>
                </div>
            </div>
        `).join('');

        projectDetails.innerHTML = `
            <h2 style="margin:0 0 8px 0; font-size:16px; color:var(--primary-color);">${selectedKey}</h2>
            <p style="font-size:12px; margin:4px 0;"><strong>Obiettivo:</strong> ${data.objective}</p>
            <p style="font-size:12px; margin:4px 0;"><strong>Team:</strong> ${teamHTML}</p>
            <hr style="border:0; border-top:1px solid #e2e8f0; margin:8px 0;">
            <p style="font-size:12px; margin:4px 0; font-weight:bold;">Avanzamento SAL:</p>
            ${tasksHTML}
        `;
    }

    // Timer Logic
    let timerInterval = null, seconds = 0, isRunning = false;
    const display = document.getElementById('display'), actionBtn = document.getElementById('actionBtn');

    function toggleTimer() {
        if (!isRunning) {
            isRunning = true;
            actionBtn.textContent = "Ferma e Salva";
            actionBtn.classList.add('stop');
            timerInterval = setInterval(() => {
                seconds++;
                const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                display.textContent = `${hrs}:${mins}:${secs}`;
            }, 1000);
        } else {
            clearInterval(timerInterval);
            isRunning = false;
            actionBtn.textContent = "Avvia Sessione di Lavoro";
            actionBtn.classList.remove('stop');
            alert(`Sessione salvata: ${display.textContent}`);
            seconds = 0;
            display.textContent = "00:00:00";
            document.getElementById('taskName').value = "";
        }
    }

    // Registrazione del Service Worker per Android
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA Pronta!'))
                .catch(err => console.log('Errore Service Worker:', err));
        });
    }
</script>

</body>
</html>
